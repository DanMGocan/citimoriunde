name: community-library
x-app: &app
  image: community-library:local
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-community}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-community}
    STORAGE_PATH: /app/storage/images
    DB_POOL_MAX: ${DB_POOL_MAX:-6}
    IMAGE_CONCURRENCY: 1
    TRUSTED_PROXY: "true"
  volumes:
    - images:/app/storage/images
  networks: [internal]
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-community}
      POSTGRES_DB: ${POSTGRES_DB:-community}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: [postgres, -c, "max_connections=${POSTGRES_MAX_CONNECTIONS:-30}", -c, "shared_buffers=${POSTGRES_SHARED_BUFFERS_MB:-128}MB", -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, log_min_error_statement=panic]
    # PostgreSQL 18 official images use a versioned PGDATA below this parent.
    volumes: [database:/var/lib/postgresql]
    networks: [internal]
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    mem_limit: ${DATABASE_MEMORY_MB:-768}m
    cpus: ${DATABASE_CPUS:-0.6}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    <<: *app
    mem_limit: ${WEB_MEMORY_MB:-1024}m
    cpus: ${WEB_CPUS:-1.0}
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
  worker:
    <<: *app
    stop_grace_period: ${WORKER_STOP_GRACE_SECONDS:-60}s
    command: [node, --import, tsx, scripts/worker.ts]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-community}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:-community}
      STORAGE_PATH: /app/storage/images
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-2}
      IMAGE_CONCURRENCY: 1
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: ${WORKER_MEMORY_MB:-384}m
    cpus: ${WORKER_CPUS:-0.25}
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, 'try { process.exit(Date.now()-Number(require("fs").readFileSync("/tmp/community-worker-heartbeat","utf8"))<90000?0:1) } catch { process.exit(1) }']
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2.11.7-alpine
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    environment:
      PROXY_MAX_BODY_SIZE: ${PROXY_MAX_BODY_MB:-16}MB
    ports: ["127.0.0.1:${PREVIEW_PROXY_PORT:-8080}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
    mem_limit: ${PROXY_MEMORY_MB:-128}m
    cpus: ${PROXY_CPUS:-0.15}
    restart: unless-stopped
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  database:
  images:
  caddy_data:
  caddy_config:
networks:
  internal:
