# Usage: docker compose -f compose.yml -f compose.production.yml ...
# Configure APP_ENV=production, APP_URL=https://real-domain, SITE_DOMAIN, TLS_EMAIL first.
services:
  web:
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set the canonical HTTPS origin}
  worker:
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:?Set the canonical HTTPS origin}
  proxy:
    ports: !override ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the real domain}
      TLS_EMAIL: ${TLS_EMAIL:?Set a real certificate contact email}
      APP_URL: ${APP_URL:?Set the canonical HTTPS origin}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
